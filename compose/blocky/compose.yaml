services:

  tailscale:
    image: tailscale/tailscale:latest
    restart: on-failure
    environment:
      - TS_AUTHKEY
      - TS_EXTRA_ARGS
      - TS_STATE_DIR
      - TS_HOSTNAME
      - TS_USERSPACE
    volumes:
      - tailscale_data:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - internal

  blocky:
    image: spx01/blocky
    restart: on-failure
    network_mode: "service:tailscale"
    environment:
      - TZ
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/config.yml:/app/config.yml:ro
      - ./config/lists:/userlists
      - qlogs:/querylog
    depends_on:
      - tailscale
      - redis

  blocky-ui:
    image: ghcr.io/gabeduartem/blocky-ui:latest
    restart: unless-stopped
    environment:
      - BLOCKY_API_URL
      - QUERY_LOG_TYPE
      - QUERY_LOG_TARGET
      - INSTANCE_NAME
    volumes:
      - qlogs:/querylog
    networks:
      - internal
      - traefik_backbone
    depends_on:
      - blocky
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blocky.rule=Host(`blocky.stickpile.net`)"
      - "traefik.http.routers.blocky.entrypoints=websecure"
      - "traefik.http.routers.blocky.tls.certresolver=httpsResolve"
      - "traefik.http.services.blocky.loadbalancer.server.port=3000"
      - "traefik.http.routers.blocky.middlewares=middlewares-authentik@file"

  redis:
    image: redis:6.2-alpine
    restart: on-failure
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal

networks:
  internal:
    name: web-prod-blocky_Internal
    driver: bridge
  traefik_backbone:
    name: traefik_backbone
    external: true

volumes:
  qlogs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/blocky/querylog"

  redis_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/redis-state"

  tailscale_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/tailscale/state"
