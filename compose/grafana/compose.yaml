services:

  alloy:
    image: grafana/alloy:v1.15.0
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    ports:
      - 12345:12345
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  grafana:
    image: grafana/grafana-oss:12.4.2
    environment:
      - GF_SERVER_ROOT_URL
      - GF_AUTH_GENERIC_OAUTH_ENABLED
      - GF_AUTH_GENERIC_OAUTH_NAME
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      - GF_AUTH_GENERIC_OAUTH_SCOPES
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL
      - GF_AUTH_GENERIC_OAUTH_API_URL
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
      - GF_AUTH_SIGNOUT_REDIRECT_URL
      - GF_AUTH_OAUTH_AUTO_LOGIN
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/datasources:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - traefik_backbone
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.stickpile.net`)"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=httpsResolve"
        - "traefik.http.routers.grafana.middlewares="

  loki:
    image: grafana/loki:3.6.10
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready | grep -q 'ready'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # promtail:
  #   image: grafana/promtail:3.6.10
  #   command: -config.file=/etc/promtail/config.yaml
  #   volumes:
  #     - ./config/promtail.yaml:/etc/promtail/config.yaml:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks:
  #     - monitoring
  #   depends_on:
  #     loki:
  #       condition: service_healthy
  #   deploy:
  #     mode: replicated
  #     replicas: 1
  #     restart_policy:
  #       condition: on-failure

networks:
  monitoring:
    name: core-prod-monitoring_internal
    driver: overlay
    attachable: true
  traefik_backbone:
    name: traefik_backbone
    external: true

volumes:
  alloy_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/alloy"

  grafana_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/grafana"

  loki_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/loki"
