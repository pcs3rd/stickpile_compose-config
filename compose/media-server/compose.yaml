services:

  ariang:
    image: hurlenko/aria2-ariang:1.3.13
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - PUID
      - PGID
      - RPC_SECRET
      - ARIA2RPCPORT
    volumes:
      - aria2_data:/aria2/conf
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ariang.rule=Host(`dl.stickpile.net`)"
      - "traefik.http.routers.ariang.entrypoints=websecure"
      - "traefik.http.routers.ariang.tls.certresolver=httpsResolve"
      - "traefik.http.services.ariang.loadbalancer.server.port=8080"
      - "traefik.http.routers.ariang.middlewares=middlewares-authentik@file"
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    environment:
      - PUID
      - PGID
      - TZ
      - NZBGET_USER
      - NZBGET_PASS
    volumes:
      - nzb_data:/config
      - downloads:/downloads
    # ports:
    #   - 6789:6789
    restart: unless-stopped
    networks:
      - mediaserver
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nzb.rule=Host(`nzb.stickpile.net`)"
      - "traefik.http.routers.nzb.entrypoints=websecure"
      - "traefik.http.routers.nzb.tls.certresolver=httpsResolve"
      - "traefik.http.services.nzb.loadbalancer.server.port=6789"
      - "traefik.http.routers.nzb.middlewares=middlewares-authentik@file"
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - bazarr_data:/config
      - bazarr_db:/config/db   # local volume — SQLite is unreliable over NFS
      - media:/storage
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.stickpile.net`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr.middlewares=middlewares-authentik@file"

  # calibre:
  #   image: lscr.io/linuxserver/calibre:latest
  #   restart: on-failure
  #   security_opt:
  #     - seccomp:unconfined #optional
  #   environment:
  #     - PUID
