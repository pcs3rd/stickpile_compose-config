  flaresolverr: # broken by Cloudflare's recent anti-bot changes; awaiting upstream fix
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    env_file:
      - secrets.enc.env
    networks:
      - mediaserver
    restart: on-failure


  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: on-failure
    init: true
    environment:
      - HOST
      - PORT
      - USE_HEADLESS

    networks:
      - mediaserver

    # labels: # Internal-only; not exposed to Traefik since this service is only used for its API by other services, not directly by users.
    #   - traefik.enable=true
    #   - traefik.docker.network=traefik-backbone

    #   - traefik.http.routers.byparr.rule=Host(`byparr.stickpile.net`)
    #   - traefik.http.routers.byparr.entrypoints=websecure
    #   - traefik.http.routers.byparr.tls=true

    #   - traefik.http.services.byparr.loadbalancer.server.port=8191

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
      - JELLYFIN_PublishedServerUrl
    volumes:
      - jellyfin_data:/config
      - jellyfin_db:/config/data  # local volume — SQLite is unreliable over NFS
      - media:/media
      - ./web-config.json:/usr/share/jellyfin/web/config.json:rw
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      - mediaserver
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jf.rule=Host(`media.stickpile.net`)"
      - "traefik.http.routers.jf.entrypoints=websecure"
      - "traefik.http.routers.jf.tls.certresolver=httpsResolve"
      - "traefik.http.services.jf.loadbalancer.server.port=8096"
      #- "traefik.http.routers.jf.middlewares="

  jellyseerr:
    image: seerr/seerr:v3.2.0
    restart: on-failure
    user: "1000:1000"
    environment:
      - LOG_LEVEL
    volumes:
      - jellyseerr_data:/app/config
      - jellyseerr_db:/app/config/db   # local volume — SQLite is unreliable over NFS
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.js.rule=Host(`requests.stickpile.net`)"
      - "traefik.http.routers.js.entrypoints=websecure"
      - "traefik.http.routers.js.tls.certresolver=httpsResolve"
      - "traefik.http.services.js.loadbalancer.server.port=5055"
      - "traefik.http.routers.js.middlewares="

  komga:
    image: ghcr.io/gotson/komga:1.24.4
    restart: on-failure
    user: "911:911"
    environment:
      - TZ
      - KOMGA_DATABASE_FILE=/config/db/database.sqlite
      - KOMGA_DATABASE_TASKS_FILE=/config/db/tasks.sqlite
      - KOMGA_TASKS_DB_CHECK_LOCAL_FILESYSTEM=false
    volumes:
      - komga_config:/config
      - komga_db:/config/db   # local volume — SQLite is unreliable over NFS
      - komga_data:/data
      - media:/media
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komga.rule=Host(`komga.stickpile.net`)"
      - "traefik.http.routers.komga.entrypoints=websecure"
      - "traefik.http.routers.komga.tls.certresolver=httpsResolve"
      - "traefik.http.services.komga.loadbalancer.server.port=25600"
      - "traefik.http.routers.komga.middlewares="

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - lidarr_data:/config
      - lidarr_custom_services:/custom-services.d
      - lidarr_custom_init:/custom-cont-init.d
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.stickpile.net`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "traefik.http.routers.lidarr.middlewares=middlewares-authentik@file"

  metube:
    image: ghcr.io/alexta69/metube:2026.03.08
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - metube_downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metube.rule=Host(`metube.stickpile.net`)"
      - "traefik.http.routers.metube.entrypoints=websecure"
      - "traefik.http.routers.metube.tls.certresolver=httpsResolve"
      - "traefik.http.services.metube.loadbalancer.server.port=8081"
      - "traefik.http.routers.metube.middlewares=middlewares-authentik@file"


  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - prowlarr_data:/config
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.stickpile.net`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.middlewares=middlewares-authentik@file"

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - radarr_data:/config
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.stickpile.net`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.middlewares=middlewares-authentik@file"

  rdtclient:
    # Real-Debrid torrent client
    image: rogerfar/rdtclient:2.0.136
    restart: on-failure
    env_file:
      - secrets.enc.env
    volumes:
      - downloads:/downloads
      - rdtclient_data:/data/db
    networks:
      - traefik_backbone
      - mediaserver
    logging:
      driver: json-file
      options:
        max-size: 10m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rdt.rule=Host(`rd.stickpile.net`)"
      - "traefik.http.routers.rdt.entrypoints=websecure"
      - "traefik.http.routers.rdt.tls.certresolver=httpsResolve"
      - "traefik.http.services.rdt.loadbalancer.server.port=6500"
      - "traefik.http.routers.rdt.middlewares=middlewares-authentik@file"

  # rsoul:
  #   image: ghcr.io/pcs3rd/rsoul:release.rate-limit-test
  #   user: "1000:1000"
  #   environment:
  #     - PUID
  #     - PGID
  #     - TZ
  #     - SCRIPT_INTERVAL=30 # Script interval in seconds
  #   volumes:
  #     - downloads:/downloads
  #     - rsoul_data:/data
  #   networks:
  #     - mediaserver
  #   restart: on-failure

  slskd:
    image: slskd/slskd:0.25.1
    restart: on-failure
    user: 911:911
    environment:
      - SLSKD_REMOTE_CONFIGURATION
      - SLSKD_NO_AUTH
      - SLSKD_USERNAME
      - SLSKD_PASSWORD
      - SLSKD_SLSK_USERNAME
      - SLSKD_SLSK_PASSWORD
      - SLSKD_SHARED_DIR
      - SLSKD_DOWNLOADS_DIR
    volumes:
      - slskd_data:/app:rw
      - slskd_db:/app/data   # local volume — SQLite is unreliable over NFS
      - media:/media
      - downloads:/downloads
    ports:
      - 5030:5030/tcp
      - 5031:5031/tcp
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slskd.rule=Host(`slskd.stickpile.net`)"
      - "traefik.http.routers.slskd.entrypoints=websecure"
      - "traefik.http.routers.slskd.tls.certresolver=httpsResolve"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"
      - "traefik.http.routers.slskd.middlewares=middlewares-authentik@file"
      - "traefik.tcp.routers.slsk-p2p.entrypoints=p2p"
      - "traefik.tcp.routers.slsk-p2p.rule=HostSNI(`*`)"
      - "traefik.tcp.services.slsk-p2p.loadbalancer.server.port=50300"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - sonarr_data:/config
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.stickpile.net`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.middlewares=middlewares-authentik@file"

  soularr:
    image: mrusse08/soularr:latest
    restart: on-failure
    hostname: soularr
    user: 911:911 # should be set to your UID and GID (via `id -u` and `id -g`)
    env_file:
      - secrets.enc.env
    environment:
      - TZ
      - SCRIPT_INTERVAL=300 # Script interval in seconds
    volumes:
      - downloads:/downloads
      - soularr_data:/data
    networks:
      - mediaserver

  qbt:
    image: qmcgaw/gluetun:latest
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.ovpn
      - OPENVPN_USER
      - OPENVPN_PASSWORD
      - TZ
      - FIREWALL_VPN_INPUT_PORTS
    volumes:
      - /stateful/sys-data/vpn.ovpn:/gluetun/custom.ovpn:ro
      - /stateful/sys-data/auth.txt:/gluetun/auth.txt:ro
    networks:
      - mediaserver
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbt.rule=Host(`qbt.stickpile.net`)"
      - "traefik.http.routers.qbt.entrypoints=websecure"
      - "traefik.http.routers.qbt.tls.certresolver=httpsResolve"
      - "traefik.http.services.qbt.loadbalancer.server.port=8080"
      - "traefik.http.routers.qbt.middlewares=middlewares-authentik@file"


  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: on-failure
    network_mode: "service:qbt"
    depends_on:
      - qbt
    environment:
      - PUID
      - PGID
      - TZ
      - WEBUI_PORT=8080
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    volumes:
      - qbt_data:/config
      - downloads:/downloads



networks:
  mediaserver:
    name: web-prod-media-server_Internal
    driver: bridge
  traefik_backbone:
    name: traefik_backbone
    external: true
volumes:
  # ── Shared across services ─────────────────────────────────────────────────

  downloads:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_downloads_share}"

  media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_media_share}"

  metube_downloads:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_downloads_share}/yt-dlp"

  # ── Per-service app data ────────────────────────────────────────────────────

  aria2_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/aria2"

  qbt_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/qbittorrent"

  bazarr_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/bazaar"

  bazarr_db:
    # Local volume for Bazarr's SQLite database (/config/db).
    # Mounted on top of bazarr_data to avoid NFS file-locking issues.
    driver: local

  calibre_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/calibre/config"

  chaptarr_data:
    # Local volume — keeps SQLite off NFS.
    driver: local

  cleanuparr_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/cleanuparr"

  ersatztv_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/ErsatzTV"

  jellyfin_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/jellyfin"

  jellyfin_db:
    # Local volume for Jellyfin's SQLite databases (/config/data).
    # Mounted on top of jellyfin_data to avoid NFS file-locking issues.
    driver: local

  jellyseerr_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/jellyseerr"

  jellyseerr_db:
    # Local volume for Jellyseerr's SQLite database (/app/config/db).
    # Mounted on top of jellyseerr_data to avoid NFS file-locking issues.
    driver: local

  komga_config:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/komga/config"

  komga_db:
    # Local volume for Komga's SQLite databases.
    # Mounted at /config/db on top of komga_config to avoid NFS file-locking issues.
    driver: local

  komga_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/komga/data"

  lidarr_custom_init:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/lidarr-overlay/custom-cont-init.d"

  lidarr_custom_services:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/lidarr-overlay/custom-services.d"

  lidarr_data:
    # Local volume — keeps SQLite off NFS.
    driver: local

  prowlarr_data:
    # Local volume — keeps SQLite off NFS.
    driver: local

  radarr_data:
    # Local volume — keeps SQLite off NFS.
    driver: local

  rdtclient_data:
    # Local volume for rdtclient's SQLite database (/data/db).
    # The entire /data/db path is SQLite — no NFS needed here.
    driver: local

  rsoul_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/rsoul"

  slskd_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/slskd"

  slskd_db:
    # Local volume for slskd's SQLite database (/app/data).
    # Mounted on top of slskd_data to avoid NFS file-locking issues.
    driver: local

  sonarr_data:
    # Local volume — keeps SQLite off NFS.
    driver: local

  soularr_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
