  #     - DRI_NODE=/dev/dri/renderD128
  #   devices:
  #     - /dev/dri:/dev/dri
  #   volumes:
  #     - calibre_data:/config
  #     - downloads:/downloads
  #     - media:/data
  #   ports:
  #     - 8079:8080
  #     - 8081:8081
  #     - 8083:8083
  #     - 8181:8181
  #   shm_size: "1gb"
  #   networks:
  #     - traefik_backbone
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.calibre.rule=Host(`calibre.stickpile.net`)"
  #     - "traefik.http.routers.calibre.entrypoints=websecure"
  #     - "traefik.http.routers.calibre.tls.certresolver=httpsResolve"
  #     - "traefik.http.services.calibre.loadbalancer.server.port=8181"
  #     - "traefik.http.services.calibre.loadbalancer.server.scheme=https"
  #     - "traefik.http.routers.calibre.middlewares=middlewares-authentik@file"

  chaptarr:
    image: robertlordhood/chaptarr:latest
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - chaptarr_data:/config
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.readarr.rule=Host(`readarr.stickpile.net`)"
      - "traefik.http.routers.readarr.entrypoints=websecure"
      - "traefik.http.routers.readarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.readarr.loadbalancer.server.port=8789"
      - "traefik.http.routers.readarr.middlewares=middlewares-authentik@file"

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.9.16
    restart: on-failure
    environment:
      - PORT=11011
      - PUID
      - PGID
      - UMASK
      - TZ
    ports:
      - 11011:11011
    volumes:
      - cleanuparr_data:/config
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cu.rule=Host(`cu.stickpile.net`)"
      - "traefik.http.routers.cu.entrypoints=websecure"
      - "traefik.http.routers.cu.tls.certresolver=httpsResolve"
      - "traefik.http.services.cu.loadbalancer.server.port=11011"
      - "traefik.http.routers.cu.middlewares=middlewares-authentik@file"

  # ersatztv:
  #   image: ghcr.io/ersatztv/ersatztv
  #   restart: on-failure
  #   environment:
  #     - TZ
  #   devices:
  #     - /dev/dri/renderD128:/dev/dri/renderD128
  #   networks:
  #     - mediaserver
  #   ports:
  #     - "8409:8409"
  #   volumes:
  #     - ersatztv_data:/config
  #     - media:/media:ro
  #   tmpfs:
  #     - /transcode

  flaresolverr: # broken by Cloudflare's recent anti-bot changes; awaiting upstream fix
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    env_file:
      - secrets.enc.env
    networks:
      - mediaserver
    restart: on-failure


  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: on-failure
    init: true
    environment:
      - HOST
      - PORT
      - USE_HEADLESS

    networks:
      - mediaserver

    # labels: # Internal-only; not exposed to Traefik since this service is only used for its API by other services, not directly by users.
    #   - traefik.enable=true
    #   - traefik.docker.network=traefik-backbone

    #   - traefik.http.routers.byparr.rule=Host(`byparr.stickpile.net`)
    #   - traefik.http.routers.byparr.entrypoints=websecure
    #   - traefik.http.routers.byparr.tls=true

    #   - traefik.http.services.byparr.loadbalancer.server.port=8191

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
      - JELLYFIN_PublishedServerUrl
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - jellyfin_data:/config
      - jellyfin_db:/config/data  # local volume — SQLite is unreliable over NFS
      - media:/media
      - ./web-config.json:/usr/share/jellyfin/web/config.json:rw
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      - mediaserver
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jf.rule=Host(`media.stickpile.net`)"
      - "traefik.http.routers.jf.entrypoints=websecure"
      - "traefik.http.routers.jf.tls.certresolver=httpsResolve"
      - "traefik.http.services.jf.loadbalancer.server.port=8096"
      #- "traefik.http.routers.jf.middlewares="

  jellyseerr:
    image: seerr/seerr:v3.2.0
    restart: on-failure
    user: "1000:1000"
    environment:
      - LOG_LEVEL
    volumes:
      - jellyseerr_data:/app/config
      - jellyseerr_db:/app/config/db   # local volume — SQLite is unreliable over NFS
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.js.rule=Host(`requests.stickpile.net`)"
      - "traefik.http.routers.js.entrypoints=websecure"
      - "traefik.http.routers.js.tls.certresolver=httpsResolve"
      - "traefik.http.services.js.loadbalancer.server.port=5055"
      - "traefik.http.routers.js.middlewares="

  komga:
    image: ghcr.io/gotson/komga:1.24.4
    restart: on-failure
    user: "911:911"
    environment:
      - TZ
      - KOMGA_DATABASE_FILE=/config/db/database.sqlite
      - KOMGA_DATABASE_TASKS_FILE=/config/db/tasks.sqlite
      - KOMGA_TASKS_DB_CHECK_LOCAL_FILESYSTEM=false
    volumes:
      - komga_config:/config
      - komga_db:/config/db   # local volume — SQLite is unreliable over NFS
      - komga_data:/data
      - media:/media
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komga.rule=Host(`komga.stickpile.net`)"
      - "traefik.http.routers.komga.entrypoints=websecure"
      - "traefik.http.routers.komga.tls.certresolver=httpsResolve"
      - "traefik.http.services.komga.loadbalancer.server.port=25600"
      - "traefik.http.routers.komga.middlewares="

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - lidarr_data:/config
      - lidarr_custom_services:/custom-services.d
      - lidarr_custom_init:/custom-cont-init.d
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.stickpile.net`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "traefik.http.routers.lidarr.middlewares=middlewares-authentik@file"

  metube:
    image: ghcr.io/alexta69/metube:2026.03.08
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - metube_downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metube.rule=Host(`metube.stickpile.net`)"
      - "traefik.http.routers.metube.entrypoints=websecure"
      - "traefik.http.routers.metube.tls.certresolver=httpsResolve"
      - "traefik.http.services.metube.loadbalancer.server.port=8081"
      - "traefik.http.routers.metube.middlewares=middlewares-authentik@file"

  navidrome:
    # Subsonic-compatible music streaming server, reads media:/music read-only.
    image: deluan/navidrome:0.61.2
    restart: on-failure
    user: "${PUID}:${PGID}"
    environment:
      - TZ
      - ND_LOGLEVEL=info
    volumes:
      - navidrome_data:/data
      - media:/music:ro
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`music.stickpile.net`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls.certresolver=httpsResolve"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
      # No authentik middleware — Subsonic-API mobile/desktop clients can't do
      # the browser SSO redirect flow (same reasoning as jellyfin/jellyseerr/komga).


  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - prowlarr_data:/config
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.stickpile.net`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.middlewares=middlewares-authentik@file"

  questarr:
    image: ghcr.io/doezer/questarr:1.4.1
    restart: unless-stopped
    environment:
      - SQLITE_DB_PATH=/app/data/sqlite.db
    volumes:
      - questarr_data:/app/data
    networks:
      - traefik_backbone
      - mediaserver
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.questarr.rule=Host(`questarr.stickpile.net`)"
      - "traefik.http.routers.questarr.entrypoints=websecure"
      - "traefik.http.routers.questarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.questarr.loadbalancer.server.port=5000"
      - "traefik.http.routers.questarr.middlewares=middlewares-authentik@file"

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - radarr_data:/config
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.stickpile.net`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.middlewares=middlewares-authentik@file"

  rdtclient:
    # Real-Debrid torrent client
    image: rogerfar/rdtclient:2.0.136
    restart: on-failure
    env_file:
      - secrets.enc.env
    volumes:
      - downloads:/downloads
      - rdtclient_data:/data/db
    networks:
      - traefik_backbone
      - mediaserver
    logging:
      driver: json-file
      options:
        max-size: 10m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rdt.rule=Host(`rd.stickpile.net`)"
      - "traefik.http.routers.rdt.entrypoints=websecure"
      - "traefik.http.routers.rdt.tls.certresolver=httpsResolve"
      - "traefik.http.services.rdt.loadbalancer.server.port=6500"
      - "traefik.http.routers.rdt.middlewares=middlewares-authentik@file"

  # rsoul:
  #   image: ghcr.io/pcs3rd/rsoul:release.rate-limit-test
  #   user: "1000:1000"
  #   environment:
  #     - PUID
  #     - PGID
  #     - TZ
  #     - SCRIPT_INTERVAL=30 # Script interval in seconds
  #   volumes:
  #     - downloads:/downloads
  #     - rsoul_data:/data
  #   networks:
  #     - mediaserver
  #   restart: on-failure

  slskd:
    image: slskd/slskd:0.25.1
    restart: on-failure
    user: 911:911
    environment:
      - SLSKD_REMOTE_CONFIGURATION
      - SLSKD_NO_AUTH
      - SLSKD_USERNAME
      - SLSKD_PASSWORD
      - SLSKD_SLSK_USERNAME
      - SLSKD_SLSK_PASSWORD
      - SLSKD_SHARED_DIR
      - SLSKD_DOWNLOADS_DIR
    volumes:
      - slskd_data:/app:rw
      - slskd_db:/app/data   # local volume — SQLite is unreliable over NFS
      - media:/media
      - downloads:/downloads
    ports:
      - 5030:5030/tcp
      - 5031:5031/tcp
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slskd.rule=Host(`slskd.stickpile.net`)"
      - "traefik.http.routers.slskd.entrypoints=websecure"
      - "traefik.http.routers.slskd.tls.certresolver=httpsResolve"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"
      - "traefik.http.routers.slskd.middlewares=middlewares-authentik@file"
      - "traefik.tcp.routers.slsk-p2p.entrypoints=p2p"
      - "traefik.tcp.routers.slsk-p2p.rule=HostSNI(`*`)"
      - "traefik.tcp.services.slsk-p2p.loadbalancer.server.port=50300"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - sonarr_data:/config
      - media:/storage
      - downloads:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.stickpile.net`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.middlewares=middlewares-authentik@file"

  soularr:
    image: mrusse08/soularr:latest
    restart: on-failure
    hostname: soularr
    user: 911:911 # should be set to your UID and GID (via `id -u` and `id -g`)
    env_file:
      - secrets.enc.env
    environment:
      - TZ
      - SCRIPT_INTERVAL=300 # Script interval in seconds
    volumes:
      - downloads:/downloads
      - soularr_data:/data
    networks:
      - mediaserver

  unpackerr:
    # Watches Sonarr/Radarr/Lidarr's download queues and extracts archives
    # (rar/zip) in the shared downloads volume before each *arr app imports
    # them. No web UI, so no Traefik labels/network needed.
    image: golift/unpackerr
    restart: on-failure
    user: "${PUID}:${PGID}"
    env_file:
      - secrets.enc.env
    environment:
      - TZ
      - UN_LOG_FILE=/downloads/unpackerr.log
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY
      - UN_LIDARR_0_URL=http://lidarr:8686
      - UN_LIDARR_0_API_KEY
    volumes:
      - downloads:/downloads
    networks:
      - mediaserver
    # NOTE: UN_*_API_KEY values are NOT set via each app's own env vars —
    # Sonarr/Radarr/Lidarr generate their API key internally (Settings >
    # General in their web UI). Copy each one into secrets.enc.env under
    # the matching UN_SONARR_0_API_KEY / UN_RADARR_0_API_KEY /
    # UN_LIDARR_0_API_KEY name before deploying, or the container will start
    # but silently fail to connect to that app.
    # Chaptarr isn't included: Unpackerr only natively supports Sonarr,
    # Radarr, Lidarr, and Readarr — chaptarr (a Readarr fork for audiobooks)
    # isn't one of the four, so there's no UN_CHAPTARR_* variable for it.

  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    restart: on-failure
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - tvheadend_data:/config
      - media:/recordings
    ports:
      - 9981:9981
      - 9982:9982
    networks:
      mediaserver:
        priority: 1000   # keeps this network as the source of the container's default route
      traefik_backbone: {}
      tuner1_net:
        ipv4_address: 192.168.187.163   # unused address in the .160/29 link; host itself holds .162
      tuner2_net:
        ipv4_address: 192.168.83.67     # unused address in the .64/29 link; host itself holds .66
    # tuner1_net / tuner2_net are macvlan networks (defined below), each with a
    # host RNDIS interface as parent — one per Hauppauge tuner, since a macvlan
    # network can only bind to a single parent interface. This gives tvheadend
    # a real IP on each tuner's link without needing network_mode: host.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tvheadend.rule=Host(`tve.stickpile.net`)"
      - "traefik.http.routers.tvheadend.entrypoints=websecure"
      - "traefik.http.routers.tvheadend.tls.certresolver=httpsResolve"
      - "traefik.http.services.tvheadend.loadbalancer.server.port=9981"
      - "traefik.http.routers.tvheadend.middlewares=middlewares-authentik@file"

  qbt:
    image: qmcgaw/gluetun:latest
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.ovpn
      - OPENVPN_USER
      - OPENVPN_PASSWORD
      - TZ
      - FIREWALL_VPN_INPUT_PORTS
    volumes:
      - /stateful/sys-data/vpn.ovpn:/gluetun/custom.ovpn:ro
      - /stateful/sys-data/auth.txt:/gluetun/auth.txt:ro
    networks:
      - mediaserver
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbt.rule=Host(`qbt.stickpile.net`)"
      - "traefik.http.routers.qbt.entrypoints=websecure"
      - "traefik.http.routers.qbt.tls.certresolver=httpsResolve"
      - "traefik.http.services.qbt.loadbalancer.server.port=8080"
      - "traefik.http.routers.qbt.middlewares=middlewares-authentik@file"


  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    restart: on-failure
    network_mode: "service:qbt"
    depends_on:
      - qbt
    environment:
      - PUID
      - PGID
      - TZ
      - WEBUI_PORT=8080
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    volumes:
      - qbt_data:/config
      - downloads:/downloads



networks:
  mediaserver:
    name: web-prod-media-server_Internal
    driver: bridge
  traefik_backbone:
    name: traefik_backbone
    external: true
  tuner1_net:
    name: zz-tuner1-net-nogw   # explicit name forces this to sort AFTER
                                # web-prod-media-server_Internal and traefik_backbone
                                # alphabetically, so it can never win the default
                                # route even if `priority` isn't honored (lexical
                                # sort fallback bug — see tuner2_net below for details).
    driver: macvlan
    driver_opts:
      parent: enp0s7f7u2
    ipam:
      config:
        - subnet: 192.168.187.160/29
          # no gateway set on purpose: this is a private point-to-point link to
          # the tuner (host already sits at .162), and omitting the gateway
          # here stops Docker from ever considering this network for the
          # container's default route — that's what was causing the wrong
          # gateway before.
  tuner2_net:
    name: zz-tuner2-net-nogw   # same fix as tuner1_net. Docker picks a
                                # container's default route by network priority,
                                # but falls back to alphabetical sort of the
                                # *actual* Docker network name when priority
                                # isn't supported/honored by the installed
                                # Compose/engine version. mediaserver's real
                                # name is "web-prod-media-server_Internal" (w...)
                                # and traefik_backbone is "traefik_backbone" (t...);
                                # without this override, these macvlan networks'
                                # auto-generated project-prefixed names (m..., e.g.
                                # media_server_tuner1_net) sorted BEFORE both, and
                                # since they have no gateway, the container ended
                                # up with no default route at all instead of
                                # falling back to mediaserver.
    driver: macvlan
    driver_opts:
      parent: enp0s7f7u3
    ipam:
      config:
        - subnet: 192.168.83.64/29
          # same reasoning as tuner1_net — host already holds .66
