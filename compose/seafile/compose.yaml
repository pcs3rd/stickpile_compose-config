services:

  db:
    image: mariadb:10.11
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_ROOT_PASSWORDs=$db_pass # Required: root password for MySQL service
      - MARIADB_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - seafile_db:/var/lib/mysql  # local — MariaDB is unsafe over NFS
    networks:
      - internal

  memcached:
    image: memcached:1.6.18
    restart: on-failure
    entrypoint: memcached -m 256
    networks:
      - internal

  seafile:
    image: seafileltd/seafile-mc:11.0-latest
    restart: on-failure
    env_file:
      - secrets.enc.env
    environment:
      - DB_HOST
      - DB_ROOT_PASSWD=$db_pass
      - TIME_ZONE
      - SEAFILE_ADMIN_EMAIL
      - SEAFILE_ADMIN_PASSWORD
      - SEAFILE_SERVER_HOSTNAME
      - SEAFILE_SERVER_LETSENCRYPT
    volumes:
      - seafile_data:/shared
    ports:
      - "8000:8000"
      - "8082:8082"
      - "8981:8981"
      - "8282:80"
    depends_on:
      - db
      - memcached
    networks:
      - internal
      - backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seaf.rule=Host(`seafile.stickpile.net`)"
      - "traefik.http.routers.seaf.entrypoints=websecure"
      - "traefik.http.routers.seaf.tls.certresolver=httpsResolve"
      - "traefik.http.routers.seaf.service=seaf"
      - "traefik.http.services.seaf.loadbalancer.server.port=80"
      - "traefik.http.routers.seaf.middlewares="

      - "traefik.http.routers.seafdav.rule=Host(`seafile.stickpile.net`) && PathPrefix(`/seafdav`)"
      - "traefik.http.routers.seafdav.entrypoints=websecure"
      - "traefik.http.routers.seafdav.tls.certresolver=httpsResolve"
      - "traefik.http.routers.seafdav.service=seafdav"
      - "traefik.http.services.seafdav.loadbalancer.server.port=8076"
      - "traefik.http.routers.seafdav.middlewares="

      - "traefik.http.routers.seafhttp.rule=Host(`seafile.stickpile.net`) && PathPrefix(`/seafhttp`)"
      - "traefik.http.routers.seafhttp.entrypoints=web"
      - "traefik.http.routers.seafhttp.tls.certresolver=httpsResolve"
      - "traefik.http.routers.seafhttp.service=seafhttp"
      - "traefik.http.services.seafhttp.loadbalancer.server.port=8082"
      - "traefik.http.routers.seafhttp.middlewares="

networks:
  internal:
    name: web-prod-seafile_Internal
    driver: bridge
  backbone: # For external containers.
    name: traefik_backbone
    external: true

volumes:
  seafile_db:
    # MariaDB requires local storage — NFS causes file locking failures.
    driver: local

  seafile_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr}"
      device: ":${nfs_appdata_share}/seafile-data"
