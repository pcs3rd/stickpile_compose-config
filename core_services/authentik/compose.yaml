networks:
  authentik:
    name: core-prod-authentik_Internal
    driver: bridge
    attachable: true

  traefik_backbone: # For external containers.
    name: traefik_backbone
    external: true

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - $persist_data_home/postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_DB: $POSTGRES_DB
    env_file:  
      - secrets.enc.env  
    networks:
      - authentik
    # deploy: 
    #   mode: replicated
    #   replicas: 1
    #   endpoint_mode: vip
    #   restart_policy:
    #     condition: on-failure
    #     delay: 30s
    #     #max_attempts: 3
    #     window: 120s
  authentik:
    image: ghcr.io/goauthentik/server:$AUTHENTIK_TAG
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: $POSTGRES_USER
      AUTHENTIK_POSTGRESQL__NAME: $POSTGRES_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: $POSTGRES_PASSWORD
      AUTHENTIK_SECRET_KEY: $SECRET_KEY
    env_file:  
      - secrets.enc.env  
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.stickpile.net`)"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=httpsResolve"

      - "traefik.http.routers.authentik-output-rtr.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${DOMAINNAME}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-output-rtr.entrypoints=websecure"
      - "traefik.http.routers.authentik-output-rtr.tls.certresolver=httpsResolve"
      - "traefik.http.routers.kiwix.middlewares=bouncer@docker"


    volumes:
      - $persist_data_home/authentik/media:/media
      - $persist_data_home/authentik/custom-templates:/templates
      - $persist_data_home/authentik/certs:/certs
      - $persist_data_home/authentik/blueprints:/blueprints

    ports:
      - 9000:9000
      - 9443:9443
    depends_on:
      - postgresql
      - redis
    networks:
      - authentik
      - traefik_backbone
  worker:
    image: ghcr.io/goauthentik/server:$AUTHENTIK_TAG
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: $POSTGRES_USER
      AUTHENTIK_POSTGRESQL__NAME: $POSTGRES_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: $POSTGRES_PASSWORD
      AUTHENTIK_SECRET_KEY: $SECRET_KEY
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $persist_data_home/authentik/media:/media
      - $persist_data_home/authentik/custom-templates:/templates
      - $persist_data_home/authentik/certs:/certs
      - $persist_data_home/authentik/blueprints:/blueprints
    env_file:  
      - secrets.enc.env  
    depends_on:
      - postgresql
      - redis
    # deploy: 
    #   mode: replicated
    #   replicas: 1
    #   endpoint_mode: vip
    #   restart_policy:
    #     condition: on-failure
    #     delay: 5s
    #     ##max_attempts:  3
    #     window: 600s # jellyfin is a chonker
    networks:
      - authentik
      - traefik_backbone