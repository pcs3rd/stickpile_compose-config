services:

  authentik:
    image: ghcr.io/goauthentik/server:$AUTHENTIK_TAG
    command: server
    env_file:
      - secrets.enc.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: $POSTGRES_USER
      AUTHENTIK_POSTGRESQL__NAME: $POSTGRES_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: $POSTGRES_PASSWORD
      AUTHENTIK_SECRET_KEY: $SECRET_KEY
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - authentik_certs:/certs
      - authentik_blueprints:/blueprints
    ports:
      - 9000:9000
      - 9443:9443
    depends_on:
      - postgresql
    networks:
      - authentik
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.stickpile.net`)"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=httpsResolve"
      - "traefik.http.routers.authentik-output-rtr.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${DOMAINNAME}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-output-rtr.entrypoints=websecure"
      - "traefik.http.routers.authentik-output-rtr.tls.certresolver=httpsResolve"
      - "traefik.http.routers.kiwix.middlewares=bouncer@docker"

  postgresql:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - secrets.enc.env
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - postgresql_data:/var/lib/postgresql/data  # local — PostgreSQL is unsafe over NFS
    networks:
      - authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  worker:
    image: ghcr.io/goauthentik/server:$AUTHENTIK_TAG
    command: worker
    user: root
    env_file:
      - secrets.enc.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: $POSTGRES_USER
      AUTHENTIK_POSTGRESQL__NAME: $POSTGRES_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: $POSTGRES_PASSWORD
      AUTHENTIK_SECRET_KEY: $SECRET_KEY
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik_media:/media
      - authentik_templates:/templates
      - authentik_certs:/certs
      - authentik_blueprints:/blueprints
    depends_on:
      - postgresql
    networks:
      - authentik
      - traefik_backbone

networks:
  authentik:
    name: core-prod-authentik_Internal
    driver: bridge
    attachable: true
  traefik_backbone: # For external containers.
    name: traefik_backbone
    external: true

volumes:
  # ── Local volumes (unsafe over NFS) ────────────────────────────────────────

  postgresql_data:
    # PostgreSQL requires local storage — NFS causes file locking failures.
    driver: local

  # ── NFS volumes ─────────────────────────────────────────────────────────────
  # Shared between authentik and worker services.

  authentik_blueprints:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/authentik/blueprints"

  authentik_certs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/authentik/certs"

  authentik_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/authentik/media"

  authentik_templates:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/authentik/custom-templates"
