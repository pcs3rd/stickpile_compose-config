server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use the Docker container name as the 'container' label
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      # Use the compose service name as the 'service' label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Use the compose project (stack) name as the 'stack' label
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: stack

      # Carry the container image for easy filtering
      - source_labels: [__meta_docker_container_label_org_opencontainers_image_title]
        target_label: image

      # Drop containers that have opted out with label logging=false
      - source_labels: [__meta_docker_container_label_logging]
        regex: "false"
        action: drop
