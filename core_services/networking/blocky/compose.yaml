services:
# BLOCKY - GO Based DNS Server with CLI Support
  blocky:
    image: spx01/blocky:v0.28.2
    restart: on-failure
    # Optional the instance hostname for logging purpose
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "4000:4000/tcp"
    environment:
      - TZ
    env_file:  
      - secrets.enc.env  
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # config file
      # - ./config.yml:/app/config.yml
      - $persist_data_home/blocky-state/config.yml:/app/config.yml
      - $persist_data_home/blocky-lists/:/userlists
  blocky-redis: 
    image: redis:6.2-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    volumes: 
      - $persist_data_home/blocky-redis-state:/data
  blocky-ui:
    image: gabrielduartem/blocky-ui:1.1.4
    container_name: blocky-ui
    restart: unless-stopped
    depends_on:
      - blocky
    env_file:  
      - secrets.enc.env  
    ports:
      - 3000:3000
    environment:
      API_BASE_URL: http://192.168.1.10:4000/api
      # Uncomment to enable query logging features if you have it configured on blocky (MySQL/MariaDB only):
      # - DATABASE_URL=mysql://username:password@localhost:3306/blocky_query_log_table_name
