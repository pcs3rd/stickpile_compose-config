services:
# BLOCKY - GO Based DNS Server with CLI Support
  blocky:
    networks:
      - tailscale_support
    image: spx01/blocky:v0.28.2
    restart: on-failure
    # Optional the instance hostname for logging purpose
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "4000:4000/tcp"
    environment:
      - TZ
    env_file:  
      - secrets.enc.env  
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # config file
      # - ./config.yml:/app/config.yml
      - $persist_data_home/blocky/config.yml:/app/config.yml:ro
      - $persist_data_home/blocky/lists/:/userlists
  tailscale:
    image: tailscale/tailscale:v1.90.9
    cap_add:
      - NET_ADMIN
    # environment:
    #   - TS_AUTHKEY: $tailscale_auth_key
    # volumes: # Don't do this. I don't care about tailscale on the host, and in fact don't want this instance of TS on the host.
    #   - dev/net/tun:/dev/net/tun 
    networks:
      - tailscale_support

  blocky-redis: 
    networks:
      - tailscale_support
    image: redis:6.2-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    volumes: 
      - $persist_data_home/blocky/redis:/data

  blocky-ui:
    networks:
      - tailscale_support
      - traefik_backbone
    image: gabrielduartem/blocky-ui:latest
    restart: unless-stopped
    depends_on:
      - blocky
    # ports:
    #   - 3000:3000
    environment:
      - BLOCKY_API_URL=http://blocky:4000
      # Uncomment to enable query logging features if you have it configured on blocky (MySQL/MariaDB only):
      - DATABASE_URL=mysql://$MARIADB_USER:$MARIADB_PASSWORD@db:3306/$LOG_TABLE
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bui.rule=Host(`blocky.stickpile.net`)"
      - "traefik.http.routers.bui.entrypoints=websecure"
      - "traefik.http.routers.bui.tls.certresolver=httpsResolve"
      - "traefik.http.services.bui.loadbalancer.server.port=3000"
      - "traefik.http.routers.bui.middlewares=middlewares-authentik@file"
  db:
    image: mariadb
    restart: always
    env_file:  
      - secrets.enc.env  
    volumes: 
      - $persist_data_home/blocky/db:/var/lib/mysql
    networks:
      - tailscale_support
  adminer:
    image: adminer
    restart: always
    ports:
      - 8685:8080
    networks:
      - tailscale_support


networks:
  tailscale_support:
    name: web-prod-tailscale-support_Internal
    driver: bridge
    attachable: true
  traefik_backbone:
    # For external containers.
    name: traefik_backbone
    external: true