services:

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.6-debian
    environment:
      - PGID
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve firix/authentik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      - PARSERS=crowdsecurity/docker-logs
      - BOUNCER_KEY_TRAEFIK
    volumes:
      - proxy-logs:/var/log/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/auth.log:/var/log/auth.log:ro  # host system auth log; adjust path for non-Debian hosts
      - crowdsec_config:/etc/crowdsec
      - crowdsec_db:/var/lib/crowdsec/data  # local — CrowdSec uses SQLite
      - crowdsec_logs:/var/log/crowdsec:ro
    networks:
      - traefik_backbone
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      placement:
        constraints:
          - node.role == manager  # Pin to manager — crowdsec_db is a local volume
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=false"
        - "traefik.http.routers.cs.rule=Host(`npm.crowdsec.stickpile.net`)"
        - "traefik.http.routers.cs.entrypoints=websecure"
        - "traefik.http.routers.cs.tls.certresolver=httpsResolve"
        - "traefik.http.services.cs.loadbalancer.server.port=8080"
        - "traefik.http.routers.cs.middlewares=middlewares-authentik@file,bouncer@file"

  geoipfilter:
    image: mpdcampbell/traefik-geoip-filter
    # NOTE: container_name removed — not supported in Swarm mode.
    environment:
      - MAXMIND_ID
      - MAXMIND_KEY
      - FILTER_TYPE
      - COUNTRY_CODES
      - SUB_CODES
      - TZ
      #- SEARCH_MODE="true"
    volumes:
      - geoip:/geoip
    # To apply the geoipfilter middleware to a service, add:
    #   - "traefik.http.routers.<routerName>.middlewares=middlewares-geoipfilter"
    # And on the traefik service label:
    #   - "traefik.http.middlewares.middlewares-geoipfilter.forwardAuth.address=http://geoipfilter:8080/traefik"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  traefik:
    image: "traefik:v3.5.3"
    environment:
      - BOUNCER_KEY_TRAEFIK
    entrypoint: ["/bin/sh", "/etc/traefik/entrypoint.sh"]
    command:
      #- "--log.level=DEBUG"
      - "-tracing=true"
      - "--api.insecure=true"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik_backbone"
      - "--entryPoints.p2p.address=:50300"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entryPoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.httpsResolve.acme.httpchallenge=true"
      - "--certificatesresolvers.httpsResolve.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--certificatesresolvers.httpsResolve.acme.email=rdean@stickpile.net"
      - "--certificatesresolvers.httpsResolve.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.directory=/rules"
      - "--log.level=INFO"
      - "--log.filePath=/var/log/traefik/access.log"
      - "--log.maxSize=500"
      - "--log.maxAge=12"
      - "--log.format=json"
      - "--experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer.version=v1.2.1"
    ports:
      - "80:80"
      - "443:443"
      - "50300:50300"
    volumes:
      - ./entrypoint.sh:/etc/traefik/entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./rules:/rules
      - letsencrypt_data:/letsencrypt
      - proxy-logs:/var/log/traefik
    tmpfs:
      - /run/secrets
    networks:
      - traefik_backbone
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      placement:
        constraints:
          - node.role == manager  # Traefik must run on manager to access Swarm API
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`npm.stickpile.net`)"
        - "traefik.http.routers.traefik.entrypoints=websecure"
        - "traefik.http.routers.traefik.tls.certresolver=httpsResolve"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"
        - "traefik.http.routers.traefik.middlewares=middlewares-authentik@file"
        - "traefik.http.middlewares.bouncer.plugin.crowdsec-bouncer.enabled=true"
        #- "traefik.http.middlewares.bouncer.plugin.crowdsec-bouncer.crowdseclapikey=$BOUNCER-API-KEY"
        #- "traefik.http.middlewares.middlewares-geoipfilter.forwardAuth.address=http://geoipfilter:8080/traefik"

networks:
  traefik_backbone: # For external containers.
    name: traefik_backbone
    external: true

volumes:
  # ── Local volumes (unsafe over NFS) ────────────────────────────────────────

  crowdsec_db:
    # CrowdSec uses SQLite — keep local to avoid NFS file-locking issues.
    driver: local

  # ── NFS volumes ─────────────────────────────────────────────────────────────

  crowdsec_config:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/crowdsec/config"

  crowdsec_logs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/crowdsec/log"

  geoip:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/geoip"

  letsencrypt_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/letsencrypt"

  proxy-logs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${nfs_addr},rw,nfsvers=4"
      device: ":${nfs_share}/appdata/traefik/logs"
