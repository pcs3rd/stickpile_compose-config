  immich-database:
    env_file:  
      - secrets.enc.env  
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - $persist_data_home/immich/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_DB: $DB_DATABASE_NAME
      POSTGRES_INITDB_ARGS: '--data-checksums'
    networks:
      - mediaserver
    command: >-
      postgres -c shared_preload_libraries=vectors.so -c 'search_path="$$user",
      public, vectors' -c logging_collector=on -c max_wal_size=2GB -c
      shared_buffers=512MB -c wal_compression=on
    restart: always
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" ||
        exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}"
        --username="$${POSTGRES_USER}" --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM
        pg_stat_database')"; echo "checksum failure count is $$Chksum"; [
        "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

  immich-machine-learning:
    env_file:  
      - secrets.enc.env  
    image: ghcr.io/immich-app/immich-machine-learning:$IMMICH_VERSION
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - $persist_data_home/immich/model-cache:/cache
    # env_file:
    #   - .env
    networks:
      - mediaserver
    restart: always
    healthcheck:
      disable: false

  immich-redis:
    env_file:  
      - secrets.enc.env  
    image: docker.io/redis:6.2-alpine@sha256:148bb5411c184abd288d9aaed139c98123eeb8824c5d3fce03cf721db58066d8
    networks:
      - mediaserver
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1
  immich-server:
    env_file:  
      - secrets.enc.env  
    image: ghcr.io/immich-app/immich-server:$IMMICH_VERSION
    depends_on:
      - immich-database
      - immich-redis
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - $persist_data_home/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    # env_file:
    #   - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.stickpile.net`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=httpsResolve"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    networks:
      - traefik_backbone
      - mediaserver
    restart: always
    healthcheck:
      disable: false

