services:
  tinshop:
    image: ghcr.io/ajmandourah/tinshop-ng:v0.5.3
    restart: always
    environment:
      - PUID
      - PGID
      - TINSHOP_REVERSEPROXY=True
      - TINSHOP_SOURCES_DIRECTORIES=/games
      - TINSHOP_WELCOMEMESSAGE=Welcome to my Tinshop!
    volumes:
      - $media_mount/2111/games:/games
      - $persist_data_home/tinshop:/data  #this is where config.yaml and titles json file will live. added keys here should also be modifed in config.yaml file as /data/prod.keys 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tin.rule=Host(`shop.stickpile.net`)"
      - "traefik.http.routers.tin.entrypoints=websecure"
      - "traefik.http.routers.tin.tls.certresolver=httpsResolve"
      - "traefik.http.services.tin.loadbalancer.server.port=3000"
      - "traefik.http.routers.tin.middlewares=middlewares-authentik@file"
    networks:
      - traefik_backbone
      - mediaserver
    # env_file:  
    #   - secrets.enc.env  

  ariang:
    image: hurlenko/aria2-ariang:1.3.13
    volumes:
      - $downloads_home:/downloads
      - $persist_data_home/aria2:/aria2/conf
      - $media_mount/2111/games:/games
    # - ${game_data_games}/games:/aria2/data/tournaments
    env_file:  
      - secrets.enc.env  
    environment:
      - PUID
      - PGID
      - RPC_SECRET
      - ARIA2RPCPORT
    networks:
      - traefik_backbone
      - mediaserver
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ariang.rule=Host(`dl.stickpile.net`)"
      - "traefik.http.routers.ariang.entrypoints=websecure"
      - "traefik.http.routers.ariang.tls.certresolver=httpsResolve"
      - "traefik.http.services.ariang.loadbalancer.server.port=8080"
      - "traefik.http.routers.ariang.middlewares=middlewares-authentik@file"

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6
    volumes:
      - $persist_data_home/bazaar:/config
      - $media_mount:/storage
    # env_file:  
    #   - secrets.enc.env  
    environment:
      - PUID
      - PGID
      - TZ
    networks:
      - traefik_backbone
      - mediaserver
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.stickpile.net`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=httpsResolve"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr.middlewares=middlewares-authentik@file"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    networks:
      - mediaserver
    env_file:  
      - secrets.enc.env  
   
  immich-database:
    # env_file:  
    #   - secrets.enc.env  
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - $persist_data_home/immich/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_DB: $DB_DATABASE_NAME
      POSTGRES_INITDB_ARGS: '--data-checksums'
    networks:
      - mediaserver
    command: >-
      postgres -c shared_preload_libraries=vectors.so -c 'search_path="$$user",
      public, vectors' -c logging_collector=on -c max_wal_size=2GB -c
      shared_buffers=512MB -c wal_compression=on
    restart: always
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" ||
        exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}"
        --username="$${POSTGRES_USER}" --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM
        pg_stat_database')"; echo "checksum failure count is $$Chksum"; [
        "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

  immich-machine-learning:
    env_file:  
      - secrets.enc.env  
    image: ghcr.io/immich-app/immich-machine-learning:$IMMICH_VERSION
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-w] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - $persist_data_home/immich/model-cache:/cache
    # env_file:
    #   - .env
    networks:
      - mediaserver
    restart: always
    healthcheck:
      disable: false
  immich-redis:
    env_file:  
      - secrets.enc.env  
    image: docker.io/redis:6.2-alpine@sha256:148bb5411c184abd288d9aaed139c98123eeb8824c5d3fce03cf721db58066d8
    networks:
      - mediaserver
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1
  immich-server:
    env_file:  
      - secrets.enc.env  
    image: ghcr.io/immich-app/immich-server:$IMMICH_VERSION
    depends_on:
      - immich-database
      - immich-redis
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - $persist_data_home/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    # env_file:
    #   - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.stickpile.net`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=httpsResolve"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    networks:
      - traefik_backbone
      - mediaserver
    restart: always
    healthcheck:
      disable: false
