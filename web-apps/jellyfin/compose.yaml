services:
  tinshop:
    image: ghcr.io/ajmandourah/tinshop-ng:v0.5.3
    restart: always
    environment:
      - PUID
      - PGID
      - TINSHOP_REVERSEPROXY=True
      - TINSHOP_SOURCES_DIRECTORIES=/games
      - TINSHOP_WELCOMEMESSAGE=Welcome to my Tinshop!
    volumes:
      - $media_mount/2111/games:/games
      - $persist_data_home/tinshop:/data  #this is where config.yaml and titles json file will live. added keys here should also be modifed in config.yaml file as /data/prod.keys 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tin.rule=Host(`shop.stickpile.net`)"
      - "traefik.http.routers.tin.entrypoints=websecure"
      - "traefik.http.routers.tin.tls.certresolver=httpsResolve"
      - "traefik.http.services.tin.loadbalancer.server.port=3000"
      - "traefik.http.routers.tin.middlewares=middlewares-authentik@file"
    networks:
      - traefik_backbone
      - mediaserver
    env_file:  
      - secrets.enc.env  
  ariang:
    image: hurlenko/aria2-ariang:1.3.11
    
    volumes:
      - $downloads_home:/downloads
      - $persist_data_home/aria2:/aria2/conf
      - $media_mount/2111/games:/games
    # - ${game_data_games}/games:/aria2/data/tournaments
    env_file:  
      - secrets.enc.env  
    environment:
      - PUID
      - PGID
      - RPC_SECRET
      - ARIA2RPCPORT
    networks:
      - traefik_backbone
      - mediaserver
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ariang.rule=Host(`dl.stickpile.net`)"
      - "traefik.http.routers.ariang.entrypoints=websecure"
      - "traefik.http.routers.ariang.tls.certresolver=httpsResolve"
      - "traefik.http.services.ariang.loadbalancer.server.port=8080"
      - "traefik.http.routers.ariang.middlewares=middlewares-authentik@file"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        ##max_attempts:  3
        window: 120s

