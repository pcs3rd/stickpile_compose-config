    container_name: soularr
    hostname: soularr
    user: 911:911 # this should be set to your UID and GID, which can be determined via `id -u` and `id -g`, respectively
    env_file:  
      - secrets.enc.env  
    environment:
      - TZ
      - SCRIPT_INTERVAL=300 # Script interval in seconds
    volumes:
      # "You can set /downloads to whatever you want but will then need to change the Slskd download dir in your config file"
      - $downloads_home:/downloads
        # Select where you are storing your config file.
        # Leave "/data" since thats where the script expects the config file to be
      - $persist_data_home/soularr:/data
    restart: unless-stopped
    networks:
      - traefik_backbone
      - mediaserver
    deploy: 
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  slskd:
    env_file:  
      - secrets.enc.env  
    environment:
      - SLSKD_REMOTE_CONFIGURATION
      - SLSKD_NO_AUTH
      - SLSKD_USERNAME
      - SLSKD_PASSWORD
      - SLSKD_SLSK_USERNAME
      - SLSKD_SLSK_PASSWORD
      - SLSKD_SHARED_DIR
      - SLSKD_DOWNLOADS_DIR
    ports:
      - 5030:5030/tcp
      - 5031:5031/tcp
      - 50300:50300/tcp
    volumes:
      - $persist_data_home/slskd:/app:rw
      - $media_mount:/media
      - $downloads_home:/downloads
    networks:
      - traefik_backbone
      - mediaserver
    user: 911:911
    image: slskd/slskd:0.23.2.65534-514c4f65
    deploy: 
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slskd.rule=Host(`slskd.stickpile.net`)"
      - "traefik.http.routers.slskd.entrypoints=websecure"
      - "traefik.http.routers.slskd.tls.certresolver=httpsResolve"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"
      - "traefik.http.routers.slskd.middlewares=middlewares-authentik@file"
      
  bliss_service:
    image: romancin/bliss:latest
      - secrets.enc.env  

    networks:
      - traefik_backbone
      - mediaserver
    environment:
      - PUID
      - PGID
      - TZ
    volumes:
      - $persist_data_home/bliss:/config
      - $media_mount:/storage
    #ports:
      #- "3220:3220"
      #- "3221:3221"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bliss.rule=Host(`tags.stickpile.net`)"
      - "traefik.http.routers.bliss.entrypoints=websecure"
      - "traefik.http.routers.bliss.tls.certresolver=httpsResolve"
      - "traefik.http.services.bliss.loadbalancer.server.port=3220"
      - "traefik.http.routers.bliss.middlewares=middlewares-authentik@file"
networks:
  mediaserver:
    name: web-prod-media-server_Internal
    driver: overlay
    attachable: true
  internet:
    driver: bridge
  traefik_backbone:
    # For external containers.
    name: traefik_backbone
    external: true

  zdvr1:
    driver: macvlan
    name: zdvr1-nonet
    driver_opts:
      parent: enp0s20f0u4
    ipam:
      config:
        - subnet: "192.168.187.160/29"
          #ip_range: "192.168.187.160/29"
          #gateway: "192.168.187.162"

  zdvr2:
    driver: macvlan
    name: zdvr2-nonet
    driver_opts:
      parent: enp0s20f0u5
    ipam:
      config:
        - subnet: "192.168.83.64/29"
          #ip_range: "192.168.83.64/29"
          #gateway: "192.168.83.66"
