      - "traefik.http.routers.bliss.rule=Host(`tags.stickpile.net`)"
      - "traefik.http.routers.bliss.entrypoints=websecure"
      - "traefik.http.routers.bliss.tls.certresolver=httpsResolve"
      - "traefik.http.services.bliss.loadbalancer.server.port=3220"
      - "traefik.http.routers.bliss.middlewares=middlewares-authentik@file"

  ersatztv:
    image: ghcr.io/ersatztv/ersatztv
    container_name: ersatztv
    # env_file:  
    #   - secrets.enc.env  
    environment:
      - TZ # Edit for your timezone, list can be found https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
    #   - NVIDIA_VISIBLE_DEVICES:all
    #   - NVIDIA_DRIVER_CAPABILITIES:all
    # devices:
    #   - nvidia.com/gpu=all
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      - mediaserver
    ports: # This maps port from host:container
      - "8409:8409"
    volumes:
     # Required: Configuration data (must be writable)
      - $persist_data_home/ErsatzTV:/config
     # Required: media directories - Where your media files are stored. Use :ro at the end of the path to limit container to Read-Only
      - $media_mount:/media:ro
# tmpfs is optional but recommended: Limits writing to SSD/disk by using RAM for transcode files. Comment out to disable
    tmpfs:
      - /transcode
    restart: unless-stopped

  rsoul:
    restart: unless-stopped
    container_name: rsoul
    hostname: rsoul
    environment: 
      - PUID
      - PGID
      - TZ
      #Script interval in seconds
      - SCRIPT_INTERVAL=300
    user: "1000:1000"
    volumes:
      #"You can set /downloads to whatever you want but will then need to change the Slskd download dir in your config file"
      - $downloads_home:/downloads
      # Stacks download directory (uncomment if using Stacks backend)
      # - /path/to/stacks/downloads:/stacks-downloads
      #Select where you are storing your config file. Leave "/data" since thats where the script expects the config file to be
      - $persist_data_home/rsoul:/data
    image: mephistopheles1/rsoul:latest
    networks:
      - mediaserver

  # Uncomment to run FlareSolverr for DDoS-Guard bypass (used by Stacks backend)
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   container_name: flaresolverr
  #   restart: unless-stopped
  #   environment:
  #     - LOG_LEVEL=info
  #   ports:
  #     - "8191:8191"
networks:
  mediaserver:
    name: web-prod-media-server_Internal
    driver: bridge
    attachable: true
  traefik_backbone:
    # For external containers.
    name: traefik_backbone
    external: true
